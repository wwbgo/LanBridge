name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and package
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK 10.0.403
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.403

      - name: Confirm required SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (dotnet --version).Trim()
          if ($actual -ne '10.0.403') {
            throw "Required .NET SDK 10.0.403 is unavailable; runner selected '$actual'."
          }

      - name: Validate tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'push' -and $env:REF_TYPE -eq 'tag') {
            $tag = $env:REF_NAME
            if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
              throw "Stable release tags must match vX.Y.Z; received '$tag'."
            }
            $version = $Matches.version
            & ./scripts/Release.ps1 -TagName $tag -ValidateOnly
          } else {
            # Manual runs and pushes to main validate/build the local default only.
            $tag = ''
            $version = '0.1.0'
            & ./scripts/Release.ps1 -Version $version -ValidateOnly
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Validated version $version"

      - name: Run packaging contract tests
        shell: pwsh
        run: python -m unittest tests/test_release_packaging.py -v

      - name: Build and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Build.ps1 -Configuration Release -Version $env:RELEASE_VERSION -ArtifactsRoot 'artifacts/ci'
          if ($LASTEXITCODE -ne 0) { throw 'Build.ps1 failed.' }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress --yes
          $candidates = @(@(
            (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source,
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_ -PathType Leaf) })
          if ($candidates.Count -eq 0) { throw 'ISCC.exe was not found after installing Inno Setup.' }
          $iscc = (Resolve-Path $candidates[0]).Path
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using $iscc"

      - name: Create release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Release.ps1 -Version $env:RELEASE_VERSION -OutputRoot 'artifacts/release' -IsccPath $env:ISCC_PATH -Force
          if ($LASTEXITCODE -ne 0) { throw 'Release.ps1 failed.' }
          $required = @('LanBridge-Setup.exe', 'LanBridge-win-x64.zip', 'SHA256SUMS')
          foreach ($name in $required) {
            $path = Join-Path 'artifacts/release' $name
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing release asset: $path" }
          }

      - name: Upload release assets for publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            artifacts/release/LanBridge-Setup.exe
            artifacts/release/LanBridge-win-x64.zip
            artifacts/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Create draft, upload assets, then publish
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $api = "https://api.github.com/repos/$env:REPOSITORY"
          $tag = $env:TAG_NAME
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') { throw "Invalid release tag '$tag'." }

          try {
            $existing = Invoke-RestMethod -Method Get -Uri "$api/releases/tags/$tag" -Headers $headers
            if ($null -ne $existing) { throw "Release '$tag' already exists; refusing to overwrite it." }
          } catch {
            $status = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { 0 }
            if ($status -ne 404) { throw }
          }

          $createBody = @{
            tag_name = $tag
            target_commitish = $env:TARGET_SHA
            name = "LanBridge $tag"
            draft = $true
            prerelease = $false
            generate_release_notes = $true
          } | ConvertTo-Json
          $draft = Invoke-RestMethod -Method Post -Uri "$api/releases" -Headers $headers -ContentType 'application/json' -Body $createBody
          $releaseId = $draft.id
          Write-Host "Created draft release $releaseId for $tag"

          $names = @('LanBridge-Setup.exe', 'LanBridge-win-x64.zip', 'SHA256SUMS')
          foreach ($name in $names) {
            $file = Join-Path 'release-assets' $name
            if (-not (Test-Path $file -PathType Leaf)) { throw "Missing downloaded asset '$file'." }
            $uploadUri = "https://uploads.github.com/repos/$env:REPOSITORY/releases/$releaseId/assets?name=$([uri]::EscapeDataString($name))"
            Invoke-RestMethod -Method Post -Uri $uploadUri -Headers $headers -ContentType 'application/octet-stream' -InFile $file | Out-Null
            Write-Host "Uploaded $name"
          }

          $verified = Invoke-RestMethod -Method Get -Uri "$api/releases/$releaseId" -Headers $headers
          $actual = @($verified.assets | ForEach-Object name | Sort-Object)
          $expected = @($names | Sort-Object)
          if (($actual -join '|') -ne ($expected -join '|')) {
            throw "Draft assets do not match expected set: $($actual -join ', ')"
          }
          foreach ($asset in $verified.assets) {
            $localFile = Join-Path 'release-assets' $asset.name
            if ($asset.state -ne 'uploaded' -or $asset.size -ne (Get-Item $localFile).Length) { throw "Incomplete asset: $($asset.name)" }
          }
          $published = Invoke-RestMethod -Method Patch -Uri "$api/releases/$releaseId" -Headers $headers -ContentType 'application/json' -Body (@{ draft = $false; prerelease = $false; make_latest = 'true' } | ConvertTo-Json)
          $verified = Invoke-RestMethod -Method Get -Uri "$api/releases/$releaseId" -Headers $headers
          if ($verified.draft -or $verified.prerelease) { throw "Release '$tag' did not become a stable publication." }
          Write-Host "Published and verified $($verified.html_url)"
